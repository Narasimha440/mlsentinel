[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlsentinel"
version = "0.1.8.dev7"

description = "Python SDK for monitoring, validating, and tracking machine learning model performance."

readme = "README.md"
requires-python = ">=3.9"

license = { file = "LICENSE" }

authors = [
    { name = "Adari Narasimha Dhoni" }
]

dependencies = [
    "requests>=2.31.0",
    "packaging>=24.0",
    "colorama>=0.4.6",
]

keywords = [
    "machine-learning",
    "mlops",
    "machine-learning-monitoring",
    "model-monitoring",
    "model-validation",
    "ai",
    "sdk",
    "monitoring",
    "ml-sentinel"
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",

    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed"
]

[project.urls]
Homepage = "https://mlsentinel.dev"
Documentation = "https://mlsentinel.dev/docs"
Repository = "https://github.com/Narasimha440/mlsentinal"
Issues = "https://github.com/Narasimha440/mlsentinal/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]